<!-- @dsCard group="Targetes" height=520 width=800 subtitle="Producte sobre panell navy" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0}
body{background:var(--surface-100);color:var(--ink);font-family:var(--font-sans);padding:16px}
.lbl{margin:0 0 8px;font-size:12px;line-height:16px;color:var(--text-muted)}
.frame{max-width:100%;margin:0 0 24px;border:1px dashed var(--border-strong);position:relative}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 20px}
.navy{background:var(--surface-card);padding:20px}
</style></head>
<body><div id="root"></div>
<script>
var T = window.TSF, h = React.createElement;
function Frame(p){ return h('div',null,h('p',{className:'lbl'},p.label),h('div',{className:'frame',style:{width:p.w}},p.children)); }
var noop = function(e){ if(e&&e.preventDefault) e.preventDefault(); };
function App(){
  return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:32,maxWidth:760}},
    h(T.ProductCard,{placeholder:'Producte retallat',title:'Smart 1.3',description:'El motor eléctrico fuera de borda de 1.3Kw que está revolucionando la experiencia de navegación',cta:{label:'Especificaciones',href:'#'}}),
    h(T.ProductCard,{placeholder:'Producte retallat',title:'Baterías',description:'Baterías resistentes al uso marítimo, herméticas y pensadas para la longevidad',cta:{label:'Especificaciones',href:'#'}}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
