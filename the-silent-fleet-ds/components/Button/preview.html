<!-- @dsCard group="Accions" height=320 subtitle="Píndola en 4 variants" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0}
body{background:var(--surface-100);color:var(--ink);font-family:var(--font-sans);padding:16px}
.lbl{margin:0 0 8px;font-size:12px;line-height:16px;color:var(--text-muted)}
.frame{max-width:100%;margin:0 0 24px;border:1px dashed var(--border-strong);position:relative}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 20px}
.navy{background:var(--surface-card);padding:20px}
</style></head>
<body><div id="root"></div>
<script>
var T = window.TSF, h = React.createElement;
function Frame(p){ return h('div',null,h('p',{className:'lbl'},p.label),h('div',{className:'frame',style:{width:p.w}},p.children)); }
var noop = function(e){ if(e&&e.preventDefault) e.preventDefault(); };
function App(){
  return h('div',null,
    h('p',{className:'lbl'},'Sobre surface-100'),
    h('div',{className:'row'},
      h(T.Button,{variant:'solid'},'Enviar'),
      h(T.Button,{variant:'outline'},'Marcas'),
      h(T.Button,{variant:'link'},'← Volver'),
      h(T.Button,{variant:'solid',size:'sm'},'Enviar'),
      h(T.Button,{variant:'solid',disabled:true},'Desactivat')),
    h('p',{className:'lbl'},'Sobre surface-card'),
    h('div',{className:'row navy tsf-on-dark'},
      h(T.Button,{variant:'outline-light'},'Especificaciones'),
      h(T.Button,{variant:'brand'},'Junte-se agora')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
