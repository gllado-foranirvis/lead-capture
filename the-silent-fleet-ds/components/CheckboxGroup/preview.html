<!-- @dsCard group="Formularis" height=520 subtitle="Pregunta amb opcions múltiples" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0}
body{background:var(--surface-100);color:var(--ink);font-family:var(--font-sans);padding:16px}
.lbl{margin:0 0 8px;font-size:12px;line-height:16px;color:var(--text-muted)}
.frame{max-width:100%;margin:0 0 24px;border:1px dashed var(--border-strong);position:relative}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 20px}
.navy{background:var(--surface-card);padding:20px}
</style></head>
<body><div id="root"></div>
<script>
var T = window.TSF, h = React.createElement;
function Frame(p){ return h('div',null,h('p',{className:'lbl'},p.label),h('div',{className:'frame',style:{width:p.w}},p.children)); }
var noop = function(e){ if(e&&e.preventDefault) e.preventDefault(); };
function App(){
  var o=[{value:'a',label:'Sustentabilidade ambiental'},{value:'b',label:'Redução de ruído'},{value:'c',label:'Menos manutenção'},{value:'d',label:'Custos operacionais mais baixos'},{value:'e',label:'Regulamentações futuras'}];
  return h('div',{style:{maxWidth:360,display:'flex',flexDirection:'column',gap:20}},
    h(T.CheckboxGroup,{legend:'O que o entusiasma?',required:true,options:o,defaultValues:['b','c']}),
    h(T.CheckboxGroup,{legend:'O que te preocupa?',required:true,options:o.slice(0,3),error:'Escolha pelo menos uma opção'}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
